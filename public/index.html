<style>
:root{--navy:#2a5478;--teal:#5b8b9e;--mint:#94cbc7;--ink:#0e2438;--soft:#3d6073;--bg:#dff1ef;--card:rgba(255,255,255,.6);--line:rgba(14,36,56,.18);--glow:rgba(148,203,199,.9);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eaf8f6;--soft:#a9cbd0;--bg:#0a1b2b;--card:rgba(148,203,199,.1);--line:rgba(148,203,199,.25);--glow:rgba(91,139,158,.9)}}
:root[data-theme="dark"]{--ink:#eaf8f6;--soft:#a9cbd0;--bg:#0a1b2b;--card:rgba(148,203,199,.1);--line:rgba(148,203,199,.25);--glow:rgba(91,139,158,.9)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Vazirmatn',Tahoma,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(70vmax 50vmax at 85% 0%,var(--glow),transparent 60%),radial-gradient(60vmax 60vmax at 0% 70%,var(--navy),transparent 65%);opacity:.55}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
header{position:fixed;top:env(safe-area-inset-top,0px);inset-inline:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 16px}
.sp{flex:1}
.burger{width:50px;height:50px;perspective:300px}
.bx{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.burger[aria-expanded="true"] .bx{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;display:grid;place-content:center;gap:5px;backface-visibility:hidden;background:linear-gradient(135deg,var(--teal),var(--mint));box-shadow:0 6px 0 rgba(10,27,43,.45),0 12px 24px rgba(0,0,0,.25)}
.face i{display:block;width:24px;height:3px;border-radius:2px;background:#0e2438}
.face.bk{transform:rotateY(180deg);font-size:1.4rem;color:#0e2438}
.btn{padding:11px 18px;border-radius:14px;font-weight:800;font-size:.95rem;transition:transform .15s,box-shadow .15s}
.btn.p{color:#0e2438;background:linear-gradient(135deg,#7fb6bd,var(--mint));box-shadow:0 5px 0 rgba(10,27,43,.45)}
.btn.g{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(8px);box-shadow:0 5px 0 rgba(10,27,43,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(10,27,43,.4)}
.menu{position:fixed;inset:0;z-index:25;display:grid;align-content:center;justify-items:center;gap:14px;padding:90px 24px 24px;perspective:900px;background:rgba(10,27,43,.55);backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.menu.open{opacity:1;visibility:visible}
.menu button{width:min(320px,100%);padding:18px;border-radius:18px;font-size:1.2rem;font-weight:700;color:#0e2438;background:linear-gradient(135deg,var(--teal),var(--mint));box-shadow:0 8px 0 rgba(10,27,43,.5);transform:rotateX(-100deg) translateZ(-120px);transform-origin:top;opacity:0;transition:transform .7s cubic-bezier(.2,.9,.3,1.2),opacity .5s;transition-delay:calc(var(--n)*.08s)}
.menu.open button{transform:none;opacity:1}
.menu.open button:hover{transform:translateZ(40px) rotateY(-10deg) rotateX(6deg);transition-delay:0s;transition-duration:.25s}
.hero{min-height:100svh;display:grid;align-content:center;justify-items:center;text-align:center;padding:84px 18px 30px}
.word{font-size:clamp(2.6rem,12vw,4.4rem);font-weight:800;margin:0;letter-spacing:1px;background:linear-gradient(90deg,var(--ink),var(--teal),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.tag{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0;font-weight:700;letter-spacing:2px;font-size:.8rem;color:var(--soft);direction:ltr}
.poem{color:var(--soft);margin:6px 0 20px;font-size:.95rem}
.hint{font-size:.85rem;color:var(--soft);margin:0}
.work{padding:20px 18px 60px;text-align:center}
.work h2{font-size:clamp(1.5rem,5vw,2.2rem);margin:0 0 4px}
.work p{color:var(--soft);margin:0 0 6px}
.wrap{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;perspective:1200px;background:rgba(10,27,43,.6);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.wrap.open{opacity:1;visibility:visible}
.win{width:min(400px,100%);transform:rotateX(35deg) rotateY(-80deg) translateZ(-400px) scale(.6);opacity:0;transition:transform .9s cubic-bezier(.2,.9,.3,1.15),opacity .5s}
.wrap.open .win{transform:none;opacity:1}
.tl{border-radius:22px;background:var(--bg);border:1px solid var(--line);box-shadow:0 30px 60px rgba(0,0,0,.45)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-radius:22px 22px 0 0;background:linear-gradient(90deg,var(--navy),var(--teal),var(--mint))}
.bar button{width:30px;height:30px;border-radius:50%;background:rgba(10,27,43,.35);color:#fff}
.bar span{font-weight:800;color:#fff}
.fw{perspective:1000px;padding:18px;height:380px}
.fi{position:relative;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.fi.back{transform:rotateY(180deg)}
.fa{position:absolute;inset:0;display:grid;gap:10px;align-content:center;backface-visibility:hidden}
.fa.b{transform:rotateY(180deg)}
.fa input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.fa h3{margin:0;text-align:center}
.sw{background:none;color:var(--mint);font-weight:700;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}


/* ===== 3D menu ===== */
.menu{background:radial-gradient(60vmax 50vmax at 50% 40%,rgba(42,84,120,.55),rgba(10,27,43,.82))}
.mstage{position:relative;width:min(380px,100%);transform-style:preserve-3d;transform:rotateX(var(--mx,0deg)) rotateY(var(--my,0deg));transition:transform .25s ease}
.mlist{display:grid;gap:16px;transform-style:preserve-3d}
.ring{position:absolute;left:50%;top:50%;width:min(620px,150vw);aspect-ratio:1;margin:calc(min(620px,150vw)/-2) 0 0 calc(min(620px,150vw)/-2);border-radius:50%;border:3px solid rgba(148,203,199,.85);box-shadow:0 0 36px rgba(148,203,199,.5),inset 0 0 36px rgba(148,203,199,.3);pointer-events:none;opacity:0;transition:opacity .8s .2s}
.ring.r1{transform:translateZ(-420px) rotateX(72deg);animation:rs1 14s linear infinite}
.ring.r2{width:min(480px,120vw);margin:calc(min(480px,120vw)/-2) 0 0 calc(min(480px,120vw)/-2);transform:translateZ(-340px) rotateY(72deg);animation:rs2 10s linear infinite;border-color:rgba(190,235,240,.9)}
.menu.open .ring{opacity:1}
@keyframes rs1{to{transform:translateZ(-420px) rotateX(72deg) rotateZ(360deg)}}
@keyframes rs2{to{transform:translateZ(-340px) rotateY(72deg) rotateZ(360deg)}}
.mi{--rx:0deg;--ry:0deg;--gx:50%;--gy:50%;position:relative;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:16px 20px;border-radius:22px;color:#0e2438;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
 background:linear-gradient(135deg,#e6f6f5,#a9d8d4 60%,#7fb0bc);
 box-shadow:0 1px 0 #7fb6bd,0 2px 0 #78afb6,0 3px 0 #71a8af,0 4px 0 #6aa1a8,0 5px 0 #639aa1,0 6px 0 #5c939a,0 7px 0 #558c93,0 8px 0 #4e858c,0 26px 36px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7);
 opacity:0;transform:translateZ(-380px) rotateY(calc(var(--s)*85deg)) rotateX(30deg);transform-origin:50% 100%;transition:transform .8s cubic-bezier(.2,.9,.3,1.15) calc(var(--n)*.09s + .05s),opacity .5s calc(var(--n)*.09s)}
.menu.open .mi{opacity:1;transform:translateZ(calc(34px - var(--n)*8px)) rotateY(calc(var(--s)*-7deg)) rotateX(2deg)}
.menu.open .mi.tl2{transition:transform .12s ease-out,box-shadow .2s;transition-delay:0s;transform:translateZ(70px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.04)}
.mi:active{filter:brightness(.95)}
.mi:focus-visible{outline:3px solid #fff}
.mi .mn{position:absolute;top:8px;inset-inline-end:16px;font:800 .7rem/1 'Vazirmatn',sans-serif;letter-spacing:1px;color:#2a5478;opacity:.75}
.mi .mic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#0e2438,#2a5478);box-shadow:0 5px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25);transform:translateZ(30px)}
.mi .mic svg{width:24px;height:24px;stroke:#94cbc7;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mi b{font-size:1.2rem;transform:translateZ(22px);display:block;text-align:start}
.mi small{font:700 .72rem/1 system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#2a5478;opacity:.8;direction:ltr;transform:translateZ(16px)}
.mi .gl{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.35),transparent 55%);opacity:0;transition:opacity .2s}
.mi.tl2 .gl{opacity:1}
.mi.cur-page{box-shadow:0 1px 0 #7fb6bd,0 2px 0 #78afb6,0 3px 0 #71a8af,0 4px 0 #6aa1a8,0 5px 0 #639aa1,0 6px 0 #5c939a,0 7px 0 #558c93,0 8px 0 #4e858c,0 26px 36px rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.75),0 0 28px rgba(148,203,199,.9)}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}


/* ===== 3D auth modal ===== */
.wrap{background:radial-gradient(60vmax 50vmax at 50% 45%,rgba(42,84,120,.55),rgba(10,27,43,.85))}
.wrap .win{position:relative;transform-style:preserve-3d}
.wrap.open .win{transform:rotateX(var(--mx,0deg)) rotateY(var(--my,0deg))}
.wrap.open .win.live{transition:transform .18s ease-out}
.wrap.open .ring{opacity:1}
.rings .ring.r1{transform:rotateX(72deg);animation-name:rm1}.rings .ring.r2{transform:rotateY(72deg);animation-name:rm2}
@keyframes rm1{to{transform:rotateX(72deg) rotateZ(360deg)}}@keyframes rm2{to{transform:rotateY(72deg) rotateZ(360deg)}}
.rings{position:absolute;inset:0;perspective:1000px;pointer-events:none;overflow:hidden}
.tl{position:relative;transform-style:preserve-3d;background:linear-gradient(145deg,#e9f8f6,#bfe3e0 55%,#9cc9cf);border:0;
 box-shadow:0 1px 0 #7fb6bd,0 2px 0 #78afb6,0 3px 0 #71a8af,0 4px 0 #6aa1a8,0 5px 0 #639aa1,0 6px 0 #5c939a,0 7px 0 #558c93,0 8px 0 #4e858c,0 9px 0 #477e85,0 10px 0 #40777e,0 40px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8);color:#0e2438}
:root[data-theme="dark"] .tl{color:#0e2438}
.tl .gl2{position:absolute;inset:0;border-radius:22px;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.5),transparent 55%);z-index:3}
.bar{transform:translateZ(26px);box-shadow:0 6px 0 rgba(10,27,43,.35),0 14px 22px rgba(0,0,0,.25)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px 0;transform:translateZ(18px)}
.seg button{padding:10px;border-radius:14px;font-weight:800;color:#0e2438;background:linear-gradient(#f4fbfa,#cfe9e6);box-shadow:0 5px 0 #6aa1a8,0 10px 14px rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s}
.seg button.on{background:linear-gradient(135deg,#7fb6bd,#94cbc7);transform:translateY(4px);box-shadow:0 1px 0 #4e858c,inset 0 2px 6px rgba(0,0,0,.25)}
.fw{height:410px;transform-style:preserve-3d}
.fa .msg{text-align:center;min-height:1.2em;color:#2a5478;font-weight:700}
.sw{color:#2a5478}
.btn{--rx:0deg;--ry:0deg}
header .btn,.hero .btn{transform:perspective(500px) rotateX(var(--rx)) rotateY(var(--ry)) translateZ(0)}
header .btn:active,.hero .btn:active{transform:perspective(500px) translateY(4px)}


/* ===== auth: 3D fields, cube, particles ===== */
.fa{perspective:800px;gap:12px}
.fa h3{color:#0e2438;font-size:1.25rem}
.fld{--rx:0deg;--ry:0deg;--gx:50%;--gy:50%;position:relative;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-radius:18px;cursor:text;
 background:linear-gradient(135deg,#f6fcfb,#cfe9e6 70%,#b4d8d8);
 box-shadow:0 1px 0 #7fb6bd,0 2px 0 #78afb6,0 3px 0 #71a8af,0 4px 0 #6aa1a8,0 5px 0 #639aa1,0 6px 0 #5c939a,0 16px 22px rgba(0,0,0,.28),inset 0 1px 0 #fff;
 opacity:0;transform:translateZ(-260px) rotateY(calc(var(--s,1)*80deg)) rotateX(28deg);transform-origin:50% 100%;
 transition:transform .75s cubic-bezier(.2,.9,.3,1.15) calc(var(--n)*.09s + .2s),opacity .45s calc(var(--n)*.09s + .1s),box-shadow .2s}
.fld:nth-of-type(even){--s:-1}
.fa:not(.fcur) .fld,.fa:not(.fcur) .sub{transition-delay:0s;transition-duration:.25s}
.wrap.open .fa.fcur .fld{opacity:1;transform:translateZ(0) rotateY(calc(var(--s,1)*-3deg))}
.wrap.open .fa.fcur .fld.tl2{transition:transform .12s ease-out,box-shadow .2s;transition-delay:0s;transform:translateZ(34px) rotateX(var(--rx)) rotateY(var(--ry)) scale(1.03)}
.wrap.open .fa.fcur .fld:focus-within{transform:translateZ(30px) scale(1.04);box-shadow:0 1px 0 #7fb6bd,0 2px 0 #78afb6,0 3px 0 #71a8af,0 4px 0 #6aa1a8,0 5px 0 #639aa1,0 6px 0 #5c939a,0 20px 30px rgba(0,0,0,.35),0 0 0 3px #94cbc7,0 0 26px rgba(148,203,199,.8)}
.fld .mic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#0e2438,#2a5478);box-shadow:0 4px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.fld .mic svg{width:21px;height:21px;stroke:#94cbc7;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fld input{width:100%;min-width:0;padding:10px 4px!important;border:0!important;background:none!important;box-shadow:none!important;transform:none!important;color:#0e2438!important;font:inherit;outline:none}
.fld input::placeholder{color:#5b7d8d}
.fld .gl{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.55),transparent 55%);opacity:0;transition:opacity .2s}
.fld.tl2 .gl{opacity:1}
.eye{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(14,36,56,.1);color:#0e2438}
.eye svg{width:18px;height:18px;stroke:#2a5478;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eye.on{background:#0e2438}.eye.on svg{stroke:#94cbc7}
.str{display:flex;gap:6px;padding:0 10px;margin-top:-2px;opacity:0;transition:opacity .3s}
.str.show{opacity:1}
.str i{flex:1;height:7px;border-radius:4px;background:#b7d3d3;box-shadow:inset 0 1px 2px rgba(0,0,0,.3);transition:background .25s,transform .25s}
.str i.on{transform:translateY(-2px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.str[data-l="1"] i.on{background:#ff6b6b}.str[data-l="2"] i.on{background:#ffb347}.str[data-l="3"] i.on{background:#7fd6a0}.str[data-l="4"] i.on{background:#2fc4a5}
.fa .sub{opacity:0;transform:translateZ(-260px) rotateX(40deg);transform-origin:50% 100%;transition:transform .75s cubic-bezier(.2,.9,.3,1.15) calc(var(--n)*.09s + .2s),opacity .45s calc(var(--n)*.09s + .1s),background .3s,box-shadow .15s;font-size:1.05rem;padding:14px}
.wrap.open .fa.fcur .sub{opacity:1;transform:none}
.wrap.open .fa.fcur .sub:hover{transform:translateZ(26px) scale(1.03)}
.wrap.open .fa.fcur .sub:active{transform:translateY(4px)}
.fa .sub.ok{background:linear-gradient(135deg,#7fd6a0,#2fc4a5)}
.cubebox{display:block;position:relative;width:54px;height:54px;margin:0 auto 38px;perspective:500px}
.cube{display:block;position:absolute;inset:0;transform-style:preserve-3d;animation:cb 9s linear infinite;opacity:0;transition:opacity .6s .5s}
.wrap.open .cube{opacity:1}
@keyframes cb{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.cf{position:absolute;inset:0;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#2a5478,#5b8b9e);border:1.5px solid rgba(148,203,199,.9);box-shadow:inset 0 0 14px rgba(148,203,199,.5)}
.cf svg{width:26px;height:26px;stroke:#eaf8f6;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cf.f1{transform:translateZ(27px)}.cf.f2{transform:rotateY(90deg) translateZ(27px)}.cf.f3{transform:rotateY(180deg) translateZ(27px)}.cf.f4{transform:rotateY(-90deg) translateZ(27px)}.cf.f5{transform:rotateX(90deg) translateZ(27px)}.cf.f6{transform:rotateX(-90deg) translateZ(27px)}
.cubesh{position:absolute;left:50%;top:60px;width:60px;height:14px;margin-left:-30px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(6px)}
.pt{position:absolute;left:var(--l);top:var(--t);width:var(--sz);height:var(--sz);border-radius:50%;background:radial-gradient(#fff,rgba(148,203,199,.4) 60%,transparent);box-shadow:0 0 14px rgba(148,203,199,.9);opacity:0;animation:pf 6s ease-in-out infinite alternate;animation-delay:var(--d)}
.wrap.open .pt{opacity:.85}
@keyframes pf{from{transform:translate3d(0,0,0) scale(.8)}to{transform:translate3d(14px,-34px,0) scale(1.3)}}
@media (max-height:720px){.cubebox{display:none}}
@media (prefers-reduced-motion:reduce){.cube,.pt{animation:none}}


/* clean switch between login/register */
.fi,.fi.back{transform:none;transition:none}
.fa,.fa.b{transform:none;backface-visibility:visible;-webkit-backface-visibility:visible}
.fa:not(.fcur){visibility:hidden;pointer-events:none;transition:visibility 0s .22s}
.fa.fcur{visibility:visible;transition:visibility 0s .22s}
.xb{margin-left:auto;padding:4px 12px;border-radius:8px;background:linear-gradient(#ff7a72,#ff5f57);color:#fff;font-weight:700;font-size:12px;box-shadow:0 2px 0 #b8403a;position:relative;z-index:3}
.xb.hov{filter:brightness(1.15);transform:translateY(-1px)}

.dicon{position:absolute;width:116px;padding:6px 4px 5px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:1;transition:background .15s}
.dicon svg{width:74px;height:65px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.dicon span{font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);direction:rtl}
.dicon.hov{background:rgba(255,255,255,.28);filter:none}
/* ===== logo (real) ===== */
.lg{display:inline-block;position:relative;overflow:hidden;perspective:700px;border-radius:22px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lg img{display:block;width:min(300px,72vw);height:auto;border-radius:22px;background:#fff;padding:6px 10px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease,box-shadow .3s ease;box-shadow:0 14px 40px rgba(14,36,56,.28)}
.lg:hover img,.lg.on img{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.05);box-shadow:0 16px 44px rgba(110,200,220,.55),0 0 0 2px rgba(148,203,199,.7)}
.lg::after{content:"";position:absolute;inset:0;border-radius:22px;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none;mix-blend-mode:soft-light}
.lg:hover::after,.lg.on::after{transition:transform .9s ease;transform:translateX(130%)}
.hero .lg{margin-bottom:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ===== macbook ===== */
.work{overflow:hidden}

.hinge{position:absolute;left:3.5%;right:3.5%;top:calc(100% - var(--w)*.004);height:calc(var(--w)*.011);background:linear-gradient(#2a3036,#0d1013);border-radius:0 0 8px 8px;transform:translateZ(.5px)}
.base{position:absolute;left:0;top:100%;width:100%;height:calc(var(--w)*.68);transform-origin:top;transform:rotateX(90deg);border-radius:calc(var(--w)*.006) calc(var(--w)*.006) calc(var(--w)*.03) calc(var(--w)*.03);background:linear-gradient(180deg,#d3d8dc,#c4cacf 45%,#bcc3c9),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -14px 30px rgba(0,0,0,.12)}

.kb{position:absolute;left:5%;right:5%;top:5%;height:48%;display:flex;flex-direction:column;gap:calc(var(--w)*.0055);padding:calc(var(--w)*.007);border-radius:calc(var(--w)*.007);background:#0a0e12;box-shadow:inset 0 2px 6px #000,0 1px 0 rgba(255,255,255,.55)}
.kr{display:flex;gap:calc(var(--w)*.0055);flex:1}.kr.f{flex:.62}
.kk{flex:var(--g,1) 1 0;border-radius:calc(var(--w)*.004);background:linear-gradient(#323a42,#232a31);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 0 #000;display:grid;place-items:center;color:#c9d3da;font:600 calc(var(--w)*.0095)/1 system-ui,-apple-system,sans-serif;text-shadow:0 0 4px rgba(190,230,240,.6);user-select:none}
.kr.f .kk{font-size:calc(var(--w)*.0068)}
.kk.a{place-items:end start;padding:0 0 calc(var(--w)*.004) calc(var(--w)*.006)}
.spk{position:absolute;top:6%;width:3.2%;height:46%;border-radius:4px;opacity:.65;background:radial-gradient(circle,rgba(40,50,58,.9) 28%,transparent 31%) 0 0/calc(var(--w)*.0075) calc(var(--w)*.0075)}
.spk.l{left:1%}.spk.r{right:1%}
.tpd{position:absolute;left:28%;width:44%;top:59%;height:36%;border-radius:calc(var(--w)*.012);background:linear-gradient(155deg,#d0d5da,#c6ccd1 55%,#bec5cb);box-shadow:inset 0 0 0 1px rgba(60,70,80,.35),inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 rgba(255,255,255,.55);touch-action:none;cursor:pointer;transition:transform .08s,filter .08s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

.tiphint{margin:0;color:var(--soft);font-size:.9rem;padding:0 8px}
/* ===== mac desktop ===== */
.desk{position:absolute;left:0;top:0;width:1000px;height:640px;transform-origin:0 0;transform:scale(var(--s,.6));direction:ltr;font:13px/1.3 system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:#10202e;user-select:none;-webkit-user-select:none}

.d{width:12px;height:12px;border-radius:50%}.d.r{background:#ff5f57}.d.y{background:#febc2e}.d.g{background:#28c840}
.clk.hov{filter:brightness(1.12)}
.d.hov{box-shadow:0 0 0 3px rgba(0,0,0,.18)}
.pf{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px}
.pc{border-radius:10px;padding:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);text-align:center;transition:transform .15s}

/* ===== v2: dynamic light + 3D depth ===== */

.menu,.wrap{-webkit-backdrop-filter:blur(10px)}
.btn.g,.dock,.menubar{-webkit-backdrop-filter:blur(12px)}
.btn,.mi,.pc{filter:drop-shadow(calc(var(--lx)*-9px) calc(13px - var(--ly)*9px) 12px rgba(5,18,32,.34))}
.btn:active{filter:drop-shadow(0 2px 3px rgba(5,18,32,.4))}

.bw{position:absolute;left:0;top:0;transform-style:preserve-3d;animation:bob var(--u) ease-in-out var(--d) infinite alternate}

.cb i{position:absolute;inset:0;border:1.5px solid rgba(148,203,199,.85);background:linear-gradient(145deg,rgba(42,84,120,.7),rgba(148,203,199,.3));box-shadow:inset 0 0 calc(var(--s)*.3) rgba(148,203,199,.5)}
.cb i:nth-child(1){transform:translateZ(calc(var(--s)/2))}.cb i:nth-child(2){transform:rotateY(90deg) translateZ(calc(var(--s)/2))}.cb i:nth-child(3){transform:rotateY(180deg) translateZ(calc(var(--s)/2))}.cb i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}.cb i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.cb i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}

/* ===== v3 ===== */
body{position:relative}
body::before{opacity:.32;inset:-12%;transform:translate3d(calc(var(--lx)*-4vmax),calc(var(--ly)*-3vmax),0) scale(1.1);will-change:transform}
.scene{--lx:0;--ly:-.6}
